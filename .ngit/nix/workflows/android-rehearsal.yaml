version: 1
system: x86_64-linux
name: Android release rehearsal
on: [workflow_dispatch]

needs-workflows:
  ci: ci.yaml

jobs:
  android-unsigned:
    steps:
      - install
      - sync: { run: android-release.android-unsigned.sync }
      - compile: { run: android-release.android-unsigned.compile }
      - package: { run: android-release.android-unsigned.package }
    needs: [ci.android-lint]
    artifacts:
      unsigned:
        path: unsigned
        storage: archive
  android-sign:
    run: android-release.android-sign
    needs: [android-unsigned]
    secrets:
      - ANDROID_KEYSTORE_BASE64
      - ANDROID_KEYSTORE_PASSWORD
      - ANDROID_KEY_ALIAS
    artifacts:
      signed:
        path: release-artifacts
        storage: archive
    public-outputs:
      version: version.txt
