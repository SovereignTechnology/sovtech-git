version: 1
system: x86_64-linux
requirements:
  resources:
    memory-mib: { gte: 4096 }
reuse: never
name: Android release
on:
  push:
    tags: ["v*"]

needs-workflows:
  ci: ci.yaml

jobs:
  android-unsigned:
    steps:
      - install
      - sync
      - compile
      - package
    needs: [ci.android-lint]
    artifacts:
      unsigned:
        path: unsigned
        storage: archive
  android-sign:
    needs: [android-unsigned]
    secrets:
      - ANDROID_KEYSTORE_BASE64
      - ANDROID_KEYSTORE_PASSWORD
      - ANDROID_KEY_ALIAS
    artifacts:
      signed:
        path: release-artifacts
        storage: archive
    public-outputs:
      version: version.txt
  release:
    steps:
      - tools: { build: packages.x86_64-linux.ngit }
      - publish
    cancellation: { grace: 10m }
    needs: [android-sign]
    secrets: [NGIT_PUBLISHER_NBUNKSEC]
