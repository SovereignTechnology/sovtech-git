version: 1
name: Android release
on:
  push:
    tags: ["v*"]

jobs:
  test:
    run: apps.x86_64-linux.ci-test
    artifacts:
      web-dist:
        path: dist
        storage: archive
  android-lint:
    run: apps.x86_64-linux.ci-android-lint
  android-unsigned:
    needs: [test, android-lint]
    run: apps.x86_64-linux.ci-android-unsigned
    artifacts:
      unsigned:
        path: unsigned
        storage: archive
  android-sign:
    needs: [android-unsigned]
    run: apps.x86_64-linux.ci-android-sign
    secrets:
      - ANDROID_KEYSTORE_BASE64
      - ANDROID_KEYSTORE_PASSWORD
      - ANDROID_KEY_ALIAS
    artifacts:
      signed:
        path: release-artifacts
        storage: archive
    public-outputs:
      version: version.txt
  release:
    needs: [android-sign]
    run: apps.x86_64-linux.ci-release
    secrets: [NGIT_PUBLISHER_NBUNKSEC]
