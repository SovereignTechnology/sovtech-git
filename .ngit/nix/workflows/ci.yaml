version: 1
system: x86_64-linux
requirements:
  resources:
    memory-mib: { gte: 4096 }
name: CI
on: [push, pull_request]

jobs:
  test:
    steps:
      - dependencies: { build: packages.x86_64-linux.ci-dependencies }
      - e2e-server: { build: packages.x86_64-linux.e2e-server }
      - npm-lock
      - install
      - build:
          artifacts:
            web-dist: { path: dist, storage: individual }
      - format
      - check
      - lint
      - unit
      - e2e
      - publication-policy
  android-lint:
    needs: [test#dependencies]
    steps:
      - dependencies: { build: packages.x86_64-linux.android-dependencies }
      - install
      - sync
      - lint
      - signing
      - package
    artifacts:
      android-web-dist:
        path: dist
        storage: archive
