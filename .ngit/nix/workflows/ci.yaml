version: 1
system: x86_64-linux
name: CI
on: [push, pull_request]

jobs:
  test:
    steps:
      - dependencies: { build: packages.x86_64-linux.ci-dependencies }
      - tools: { build: packages.x86_64-linux.workflow-tools }
      - npm-lock
      - install
      - format
      - check
      - lint
      - unit
      - build
      - e2e
      - publication-policy
      - package
    artifacts:
      web-dist:
        path: dist
        storage: archive
  android-lint:
    needs: [test#tools]
    steps:
      - install
      - sync
      - lint
      - signing
      - package
    artifacts:
      android-web-dist:
        path: dist
        storage: archive
