version: 1
name: PR checks and preview
on: [pull_request]

jobs:
  ci-entrypoints:
    build: packages.x86_64-linux.ci-entrypoints
  test:
    run: apps.x86_64-linux.ci-test
    artifacts:
      web-dist:
        path: dist
        storage: archive
  android-lint:
    run: apps.x86_64-linux.ci-android-lint
  preview:
    needs: [test, android-lint]
    run: apps.x86_64-linux.ci-preview
    public-outputs:
      nsite_preview: nsite-preview.txt
