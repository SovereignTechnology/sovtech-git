version: 1
system: x86_64-linux
requirements:
  resources:
    memory-mib: { gte: 2048 }
reuse: never
name: PR preview
on: [pull_request]

needs-workflows:
  ci: { file: ci.yaml, wait: referenced }

jobs:
  preview:
    # Publish the uploaded build output; later CI checks run independently.
    needs: [ci.test#build]
    steps:
      - tools: { build: packages.x86_64-linux.ngit }
      - publish
    public-outputs:
      nsite_preview: nsite-preview.txt
