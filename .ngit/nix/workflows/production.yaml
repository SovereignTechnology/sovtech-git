version: 1
system: x86_64-linux
requirements:
  resources:
    memory-mib: { gte: 2048 }
reuse: never
name: Main checks and deployments
on:
  push:
    branches: [main]

needs-workflows:
  ci: ci.yaml

jobs:
  nsite:
    steps:
      - tools: { build: packages.x86_64-linux.ngit }
      - publish
    cancellation: { grace: 10m }
    needs: [ci.test]
    concurrency:
      group: production-nsite
      cancel-in-progress: false
    secrets: [NGIT_PUBLISHER_NBUNKSEC]
